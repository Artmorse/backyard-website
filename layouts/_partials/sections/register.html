{{- /* The closing call to action. */ -}}
<section id="register" class="reveal bg-meadow px-4 py-20">
  <div class="mx-auto max-w-3xl text-center text-white">
    <h2 class="mb-6 text-4xl font-bold md:text-5xl">Prêt pour l'aventure ?</h2>
    <p class="mb-8 text-xl">Rejoignez-nous pour une journée inoubliable au bord du canal.</p>

    {{ partial "cta.html" (dict "size" "lg") }}

    {{- with site.Params.registration.note }}
      <p class="mt-6 text-sm opacity-90">{{ . }}</p>
    {{- end }}
  </div>
</section>
