# The "Infos pratiques" cards.
#
# Order here is the order on the page.
#
#   icon  — a single emoji, shown before the heading
#   title — the heading
#   body  — one paragraph, Markdown allowed

- icon: "🎒"
  title: "Équipement recommandé"
  body: "Chaussures de trail, sac d'hydratation, vêtements adaptés à la météo, frontale (au cas où), et surtout : votre bonne humeur !"

- icon: "🍎"
  title: "Ravitaillement"
  body: "Un point ravitaillement sera disponible au camp de base : bananes, pommes, cacahuètes, quelques barres, bonbons et de l'eau. Complétez avec vos propres en-cas si vous avez des habitudes bien à vous."

- icon: "🚗"
  title: "Accès & parking"
  body: "Parking gratuit sur place. Le lieu exact et la trace GPX seront communiqués le jeudi 24 septembre à 8h. Covoiturage fortement encouragé !"

- icon: "⛺"
  title: "Ambiance camp de base"
  body: "Entre chaque tour, profitez de l'espace détente, musique, jeux et rencontres. Amenez votre chaise pliante pour plus de confort ! Le soir, restez pour la petite soirée qui clôturera cette belle journée : un sondage à l'inscription permet de choisir où l'on se retrouve après la course (bar, resto, pique-nique…), et le lieu retenu sera communiqué en même temps que celui de la course."
