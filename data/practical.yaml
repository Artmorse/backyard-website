# The "Infos pratiques" cards.
#
# Order here is the order on the page.
#
#   icon  — a single emoji, shown before the heading
#   title — the heading
#   body  — one paragraph, Markdown allowed

- icon: "🎒"
  title: "Équipement recommandé"
  body: "Chaussures de trail, sac d'hydratation, vêtements adaptés à la météo, frontale (au cas où), et surtout : votre bonne humeur !"

- icon: "🍎"
  title: "Ravitaillement"
  body: "Un point ravitaillement sera disponible au camp de base : bananes, pommes, cacahuètes, quelques barres, bonbons et de l'eau. Complétez avec vos propres en-cas si vous avez des habitudes bien à vous."

- icon: "🚗"
  title: "Accès & parking"
  body: "Rendez-vous au Parc de la Deûle, à Houplin-Ancoisne : [le point de départ est ici](https://maps.app.goo.gl/tkK97dhs36iVANfY9), avec un parking gratuit sur place. Accueil des coureurs dès 9h, premier départ à 10h. Covoiturage fortement encouragé !"

- icon: "⛺"
  title: "Ambiance camp de base"
  body: "Entre chaque tour, profitez de l'espace détente, musique, jeux et rencontres. Amenez votre chaise pliante pour plus de confort ! Et le soir, on ne se quitte pas si vite : c'est [le Cageot](https://maps.app.goo.gl/VRpjEWyFyiJSZ8xn7), bar & restaurant à moins de 15 minutes du départ, qui clôturera cette belle journée — la table est réservée, on y mange et on y boit un coup tous ensemble."
