baseURL = 'https://loopandbloom.backyard.lemomorse.tech/'
locale = 'fr-FR'
defaultContentLanguage = 'fr'
title = 'Loop & Bloom'

enableRobotsTXT = true
enableInlineShortcodes = true

# Public site: it is meant to be found and shared. Only the kinds that a
# one-page site has no use for are switched off — the sitemap stays.
disableKinds = ['taxonomy', 'term', 'RSS']

# The time zone the event lives in. Every date in this file is written with its
# offset, so a countdown is the same number of days for everyone; this setting
# is what makes Hugo's own date handling agree with them.
timeZone = 'Europe/Paris'

# -----------------------------------------------------------------------------
# Tailwind CSS v4 plumbing.
#
# `buildStats` writes hugo_stats.json, the list of every class the templates
# actually emit; main.css reads it through `@source`, and that is what tells
# Tailwind which utilities to generate. The mount makes it readable as an asset
# without Hugo watching it (it rewrites the file on every build, which would
# otherwise loop forever), and the cachebusters force the stylesheet to be
# rebuilt when either the class list or the CSS itself changes.
# -----------------------------------------------------------------------------
[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = 'assets/css'
    target = 'css'

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'
    disableWatch = true

# Markdown in the content files may carry the odd inline <span> for typography.
[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "Loop & Bloom, une course nature entre amis au bord du canal dans les Hauts-de-France, le 26 septembre 2026. Autant de tours de 6,7 km que possible, de 10h à 20h."

  # ---------------------------------------------------------------------------
  # The event itself. This block is the single source of truth: no date, no
  # distance and no price is written into a template or into a content file.
  # ---------------------------------------------------------------------------
  [params.event]
    tagline = "Une aventure entre amis au bord du canal"
    region = 'Hauts-de-France'

    # The date, in the three forms the pages need.
    date = '2026-09-26'
    dateShort = '26 septembre 2026'
    dateLong = 'Samedi 26 Septembre 2026'

    # Countdown target: the first start. The offset matters — without it every
    # visitor counts down to 10h in their own time zone rather than in ours.
    startsAt = '2026-09-26T10:00:00+02:00'

    welcomeFrom = '9h'
    firstStart = '10h'
    lastCall = '20h'
    scheduleNote = "Accueil dès 9h • Premier départ à 10h"

    lapDistance = '6,7 km'
    lapNote = 'Un départ chaque heure'

    # Where.
    #
    # The place was kept out of this project until the reveal — announced on the
    # site for jeudi 24 septembre à 8h, and emailed to the registered runners on
    # the day. It is published here since; `startMap` points at the meeting
    # point itself, the car park the runners are expected at.
    area = 'Parc de la Deûle'
    areaNote = 'Houplin-Ancoisne, à 15 minutes de Lille en voiture'
    locationRevealLong = 'jeudi 24 septembre à 8h'
    startMap = 'https://maps.app.goo.gl/tkK97dhs36iVANfY9'

  # ---------------------------------------------------------------------------
  # The route, published on the reveal date.
  #
  # `komootEmbed` is the share URL of the komoot tour, and the iframe it feeds is
  # the only frame on the site that reaches a third party — everything else, the
  # fonts included, is served from this domain. It carries a share token: the
  # tour is unlisted, so the token is what makes the map readable at all, and
  # replacing the tour means replacing the whole URL.
  #
  # `gpx` is a path under static/, served exactly as it was exported. The file
  # is dated rather than named `parcours.gpx`: this first edition should still be
  # unambiguous in the archive once a second one exists.
  # ---------------------------------------------------------------------------
  [params.route]
    komootEmbed = 'https://www.komoot.com/tour/3298172426/embed?share_token=amNhHU0XjOh1U0q1FnuNYw4ViPBGEQvYBXrpMO72a3BLslQosw&hl=fr&layout=classic&profile=1'
    gpx = 'gpx/loop-and-bloom-backyard-20260926.gpx'
    gpxNote = 'Trace komoot, 6,7 km par tour'

  # ---------------------------------------------------------------------------
  # Registration — the Google Form generated by create-form.gs.
  #
  # An empty `url` turns every button on the site into a discreet "à venir"
  # note rather than a dead link, and `closed = true` does the same once the
  # form has shut: the button is greyed, keeps no link, and says so. The URL is
  # left on file — it is where the answers live.
  # ---------------------------------------------------------------------------
  [params.registration]
    url = 'https://docs.google.com/forms/d/e/1FAIpQLSd6OuYaSNFJ_eGdh6Ja_BlthJ8BpoHWvSoIBBcr0lUARQwWdg/viewform'
    label = "S'inscrire maintenant"
    price = '10€'

    # Closed with the reveal, as announced: jeudi 24 septembre à 8h.
    closed = true
    closedLabel = "Inscriptions terminées"
    closedTitle = "Les inscriptions ont fermé le jeudi 24 septembre à 8h"
    note = "Inscriptions terminées • Rendez-vous le samedi 26 septembre dès 9h"

  # ---------------------------------------------------------------------------
  # How to reach the organisers.
  #
  # The address is written here once. It is never rendered into the HTML as a
  # plain mailto: the footer hands the two halves to a script that joins them
  # in the browser, which is enough to miss the crawlers that harvest addresses
  # from page source.
  # ---------------------------------------------------------------------------
  [params.contact]
    email = 'loopandbloom.backyard@gmail.com'
    instagram = 'https://instagram.com/loopandbloom.backyard'
    instagramHandle = '@loopandbloom.backyard'

  # ---------------------------------------------------------------------------
  # Audience measurement — Umami Cloud.
  #
  # Umami counts page views without a cookie and without any identifier that
  # follows a visitor from one site to another, which is why the site asks for
  # no consent. The tracker is loaded straight from cloud.umami.is: proxying it
  # to dodge ad blockers has been considered and turned down, the undercount is
  # accepted.
  #
  # `enable = false` or an empty `websiteId` removes the script from the build.
  # Only a production build carries it, so `hugo server` never touches the
  # figures.
  # ---------------------------------------------------------------------------
  [params.analytics]
    enable = true
    websiteId = '65e1bb8e-ef41-4074-9ec3-59635c2ec421'
    src = 'https://cloud.umami.is/script.js'

  # ---------------------------------------------------------------------------
  # Images, as paths inside assets/. They go through Hugo's image processing,
  # so the sources can stay as large as they like.
  # ---------------------------------------------------------------------------
  [params.images]
    banner = 'img/banner.png'
    logo = 'img/logo.png'
    icon = 'img/icon.png'
