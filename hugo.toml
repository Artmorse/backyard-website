baseURL = 'https://loopandbloom.backyard.lemomorse.tech/'
locale = 'fr-FR'
defaultContentLanguage = 'fr'
title = 'Loop & Bloom'

enableRobotsTXT = true
enableInlineShortcodes = true

# Public site: it is meant to be found and shared. Only the kinds this site has
# no use for are switched off — the sitemap stays, and so does the section list
# that serves /editions/.
disableKinds = ['taxonomy', 'term', 'RSS']

# An edition's `date` is the first start of its race, so an edition that is still
# ahead is a page dated in the future — and Hugo leaves those out of a build
# unless told otherwise. Announcing the next race is the entire point of the site,
# so they are built: what decides whether an edition is announced or archived is
# the `archived` flag in its front matter, never the clock.
buildFuture = true

# The time zone the event lives in. Every date here and in the editions' front
# matter is written with its offset, so a countdown is the same number of days
# for everyone; this setting is what makes Hugo's own date handling agree with
# them.
timeZone = 'Europe/Paris'

# -----------------------------------------------------------------------------
# Tailwind CSS v4 plumbing.
#
# `buildStats` writes hugo_stats.json, the list of every class the templates
# actually emit; main.css reads it through `@source`, and that is what tells
# Tailwind which utilities to generate. The mount makes it readable as an asset
# without Hugo watching it (it rewrites the file on every build, which would
# otherwise loop forever), and the cachebusters force the stylesheet to be
# rebuilt when either the class list or the CSS itself changes.
# -----------------------------------------------------------------------------
[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = 'assets/css'
    target = 'css'

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'
    disableWatch = true

# Markdown in the content files may carry the odd inline <span> for typography.
[markup.goldmark.renderer]
  unsafe = true

# -----------------------------------------------------------------------------
# The menu — the whole navigation of the site, in two entries.
#
# "Prochaine course" is the home page: it either announces the next edition or
# says plainly that there is no date yet. "Anciennes courses" is /editions/,
# the list of the ones already run.
#
# The labels are the visitor's words, not the section's: the content lives under
# content/editions/, which is what the URLs say, but nobody is made to read
# "éditions" in the menu.
# -----------------------------------------------------------------------------
[menus]
  [[menus.main]]
    name = 'Prochaine course'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    name = 'Anciennes courses'
    pageRef = '/editions'
    weight = 20

[params]
  description = "Loop & Bloom, une course nature entre amis au bord du canal dans les Hauts-de-France. Autant de tours d'une boucle de quelques kilomètres que possible, du matin au soir."

  # What does not change from one edition to the next. Everything that does —
  # the date, the place, the loop, the price, the questions — lives in the
  # edition's own page bundle under content/editions/, not here. See the note at
  # the top of content/editions/_index.md.
  tagline = "Une aventure entre amis au bord du canal"
  region = 'Hauts-de-France'

  # ---------------------------------------------------------------------------
  # The mailing list — the Google Form generated by create-mailinglist-form.gs.
  #
  # One email per edition, sent when a date exists. This is what the site offers
  # in the stretch between two races, when there is nothing to register for.
  #
  # An empty `url` turns the button into a discreet "bientôt" note rather than a
  # dead link, the same way registration does.
  # ---------------------------------------------------------------------------
  [params.mailinglist]
    url = ''
    label = "Être prévenu de la prochaine édition"
    note = "Un email quand la date de la prochaine édition est fixée. Pas un de plus."

  # ---------------------------------------------------------------------------
  # How to reach the organisers.
  #
  # The address is written here once. It is never rendered into the HTML as a
  # plain mailto: the footer hands the two halves to a script that joins them
  # in the browser, which is enough to miss the crawlers that harvest addresses
  # from page source.
  # ---------------------------------------------------------------------------
  [params.contact]
    email = 'loopandbloom.backyard@gmail.com'
    instagram = 'https://instagram.com/loopandbloom.backyard'
    instagramHandle = '@loopandbloom.backyard'

  # ---------------------------------------------------------------------------
  # Audience measurement — Umami Cloud.
  #
  # Umami counts page views without a cookie and without any identifier that
  # follows a visitor from one site to another, which is why the site asks for
  # no consent. The tracker is loaded straight from cloud.umami.is: proxying it
  # to dodge ad blockers has been considered and turned down, the undercount is
  # accepted.
  #
  # `enable = false` or an empty `websiteId` removes the script from the build.
  # Only a production build carries it, so `hugo server` never touches the
  # figures.
  # ---------------------------------------------------------------------------
  [params.analytics]
    enable = true
    websiteId = '65e1bb8e-ef41-4074-9ec3-59635c2ec421'
    src = 'https://cloud.umami.is/script.js'

  # ---------------------------------------------------------------------------
  # Images, as paths inside assets/. They go through Hugo's image processing,
  # so the sources can stay as large as they like.
  # ---------------------------------------------------------------------------
  [params.images]
    banner = 'img/banner.png'
    logo = 'img/logo.png'
    icon = 'img/icon.png'
